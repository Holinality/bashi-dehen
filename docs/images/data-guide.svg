<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="374" viewBox="0 0 1120 374" role="img" aria-label="哪些在本地，哪些需要联网"><rect width="1120" height="374" rx="28" fill="#edf5fe"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="40" y="62" font-size="32" font-weight="700" fill="#243d53">哪些在本地，哪些需要联网</text><text x="40" y="98" font-size="18" fill="#526f87">数据示意 · 不把估算时间当作实时信号</text><rect x="40" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="72" cy="160" r="16" fill="#286bb0"/><text x="72" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">1</text><text x="100" y="167" font-size="22" font-weight="700" fill="#243d53">本地资料</text><text x="64" y="210" font-size="18" fill="#526f87">已有线网、站序与收藏</text><text x="64" y="240" font-size="18" fill="#526f87">源码版不含运营时刻表</text><rect x="394" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="426" cy="160" r="16" fill="#267e83"/><text x="426" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">2</text><text x="454" y="167" font-size="22" font-weight="700" fill="#243d53">公交查询服务</text><text x="418" y="210" font-size="18" fill="#526f87">线路、站点和车辆到站</text><text x="418" y="240" font-size="18" fill="#526f87">覆盖与可用性由上游决定</text><rect x="748" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="780" cy="160" r="16" fill="#6773b3"/><text x="780" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">3</text><text x="808" y="167" font-size="22" font-weight="700" fill="#243d53">可选高德服务</text><text x="772" y="210" font-size="18" fill="#526f87">使用自行填写的 Key</text><text x="772" y="240" font-size="18" fill="#526f87">地图、地点搜索和联网规划</text><text x="40" y="337" font-size="17" fill="#526f87">查询会按需向对应服务发送关键词、站点或坐标；详细内容见隐私说明。</text></g></svg>
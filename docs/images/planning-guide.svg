<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="374" viewBox="0 0 1120 374" role="img" aria-label="从哪里出发，到哪里下车"><rect width="1120" height="374" rx="28" fill="#edf5fe"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="40" y="62" font-size="32" font-weight="700" fill="#243d53">从哪里出发，到哪里下车</text><text x="40" y="98" font-size="18" fill="#526f87">操作示意 · 本地地铁规划和联网综合规划分开使用</text><rect x="40" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="72" cy="160" r="16" fill="#286bb0"/><text x="72" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">1</text><text x="100" y="167" font-size="22" font-weight="700" fill="#243d53">确定起终点</text><text x="64" y="210" font-size="18" fill="#526f87">选择准确的站点或地点</text><text x="64" y="240" font-size="18" fill="#526f87">使用“我的位置”时按需定位</text><rect x="394" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="426" cy="160" r="16" fill="#267e83"/><text x="426" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">2</text><text x="454" y="167" font-size="22" font-weight="700" fill="#243d53">选择规划方式</text><text x="418" y="210" font-size="18" fill="#526f87">本地：已有离线地铁线网</text><text x="418" y="240" font-size="18" fill="#526f87">联网：自配高德 Web 服务 Key</text><rect x="748" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="780" cy="160" r="16" fill="#6773b3"/><text x="780" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">3</text><text x="808" y="167" font-size="22" font-weight="700" fill="#243d53">逐段看行程</text><text x="772" y="210" font-size="18" fill="#526f87">查看步行、线路与乘车方向</text><text x="772" y="240" font-size="18" fill="#526f87">点乘车区间打开线路详情</text><text x="40" y="337" font-size="17" fill="#526f87">联网地点搜索与综合规划需要自己的高德 Key；本地规划受内置线网完整程度限制。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="374" viewBox="0 0 1120 374" role="img" aria-label="候车时，先确认方向，再看还有多久"><rect width="1120" height="374" rx="28" fill="#edf5fe"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="40" y="62" font-size="32" font-weight="700" fill="#243d53">候车时，先确认方向，再看还有多久</text><text x="40" y="98" font-size="18" fill="#526f87">操作示意 · 对应下方站点查询和公交详情实机界面</text><rect x="40" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="72" cy="160" r="16" fill="#286bb0"/><text x="72" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">1</text><text x="100" y="167" font-size="22" font-weight="700" fill="#243d53">找站或找线路</text><text x="64" y="210" font-size="18" fill="#526f87">输入站名、线路名</text><text x="64" y="240" font-size="18" fill="#526f87">或按定位找附近站点</text><rect x="394" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="426" cy="160" r="16" fill="#267e83"/><text x="426" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">2</text><text x="454" y="167" font-size="22" font-weight="700" fill="#243d53">核对目的地方向</text><text x="418" y="210" font-size="18" fill="#526f87">看清线路的起点和终点</text><text x="418" y="240" font-size="18" fill="#526f87">用换向按钮切到另一方向</text><rect x="748" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="780" cy="160" r="16" fill="#6773b3"/><text x="780" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">3</text><text x="808" y="167" font-size="22" font-weight="700" fill="#243d53">选择候车站</text><text x="772" y="210" font-size="18" fill="#526f87">点站点轴切换目标站</text><text x="772" y="240" font-size="18" fill="#526f87">查看到站分钟数与剩余站数</text><text x="40" y="337" font-size="17" fill="#526f87">到站数据取决于当地覆盖和上游接口；无数据不等于没有车。</text></g></svg>
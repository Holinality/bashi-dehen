<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="374" viewBox="0 0 1120 374" role="img" aria-label="巴士得很"><rect width="1120" height="374" rx="28" fill="#edf5fe"/><g font-family="Noto Sans CJK SC, Source Han Sans SC, Microsoft YaHei, sans-serif"><text x="40" y="62" font-size="32" font-weight="700" fill="#243d53">巴士得很</text><text x="40" y="98" font-size="18" fill="#526f87">没有开屏广告，没有信息流。查车、看站、规划换乘。</text><rect x="40" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="72" cy="160" r="16" fill="#286bb0"/><text x="72" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">1</text><text x="100" y="167" font-size="22" font-weight="700" fill="#243d53">等公交</text><text x="64" y="210" font-size="18" fill="#526f87">双向到站 · 车辆位置</text><text x="64" y="240" font-size="18" fill="#526f87">选好站点，再确认方向</text><rect x="394" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="426" cy="160" r="16" fill="#267e83"/><text x="426" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">2</text><text x="454" y="167" font-size="22" font-weight="700" fill="#243d53">坐地铁</text><text x="418" y="210" font-size="18" fill="#526f87">线路与换乘 · 本地规划</text><text x="418" y="240" font-size="18" fill="#526f87">已有资料可保存在本地</text><rect x="748" y="128" width="332" height="164" rx="20" fill="white"/><circle cx="780" cy="160" r="16" fill="#6773b3"/><text x="780" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="white">3</text><text x="808" y="167" font-size="22" font-weight="700" fill="#243d53">看行程</text><text x="772" y="210" font-size="18" fill="#526f87">步行与乘车分段展示</text><text x="772" y="240" font-size="18" fill="#526f87">按步骤找到上下车站</text><text x="40" y="337" font-size="17" fill="#526f87">Android 5.0+  ·  Vibe Coding 开发  ·  正式安装包与公开源码版内置资料不同</text></g></svg>